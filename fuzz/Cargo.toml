[package]
name = "ww-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
ipfs = { path = "../crates/ipfs" }
libfuzzer-sys = "0.4"
serde = "=1.0.228"
serde_json = "=1.0.150"

[[bin]]
name = "fuzz_kubo_ls_response"
path = "fuzz_targets/fuzz_kubo_ls_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_kubo_mfs_ls_response"
path = "fuzz_targets/fuzz_kubo_mfs_ls_response.rs"
test = false
doc = false
bench = false
