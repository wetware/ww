name: Rust CI/CD

on:
  push:
    branches: [ "master", "staging" ]
  pull_request:
    branches: [ "master", "staging" ]
  workflow_dispatch: {}

# Serialize release-producing runs per ref so image + IPNS publication from
# different commits cannot interleave. Retain every pending run. The durable
# infrastructure Owner orders official releases; IPNS is eventual discovery.
concurrency:
  group: ww-release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  WW_BUILD_GIT_SHA: ${{ github.sha }}

jobs:
  # === Path-based change detection (master push only) ===

  changes:
    name: Detect changes
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      std: ${{ steps.filter.outputs.std }}
      host: ${{ steps.filter.outputs.host }}
      architecture_map: ${{ steps.filter.outputs.architecture_map }}
    steps:
    - uses: actions/checkout@v5
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          std:
            - 'std/**'
            - 'crates/guest/**'
            - 'examples/**'
            - 'scripts/build_wasip3_component.sh'
            - 'scripts/check_first_party_wasip3.sh'
            - 'scripts/check_native_p3_fixture.sh'
            - 'tests/fixtures/stream-lifecycle-probe/**'
            - 'rust-toolchain.toml'
          host:
            - 'src/**'
            - 'crates/**'
            - 'capnp/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'build.rs'
            - 'Containerfile*'
            - '.dockerignore'
            - 'Makefile'
            - 'scripts/**'
            - 'tests/**'
            - '.github/workflows/**'
            - '.github/actions/**'
          architecture_map:
            - 'diagrams/architecture-map.json'
            - 'diagrams/architecture-map.template.html'
            - 'scripts/generate-architecture-map.mjs'
            - 'scripts/generate-architecture-map.test.mjs'
            - 'src/**'
            - 'crates/**'
            - 'std/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'README.md'
            - 'doc/architecture.md'
            - 'doc/capabilities.md'
            - '.github/workflows/rust.yml'

  # === Always-run checks (PRs and pushes) ===

  lockfiles:
    name: Check committed Cargo lockfiles
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Check committed repository artifacts
      run: |
        python3 scripts/check_repository_artifacts.py
        python3 tests/test_repository_artifacts.py
    - uses: dtolnay/rust-toolchain@stable
    # Always resolve before dependent jobs restore compiler caches or build.
    - run: bash scripts/check_cargo_lockfiles.sh
    - run: bash tests/test_cargo_lockfiles.sh

  test-architecture-map:
    name: Test architecture map
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        package-manager-cache: false

    - name: Test map generator
      run: node --test scripts/generate-architecture-map.test.mjs

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: cargo fmt --all -- --check
      run: |
        cargo fmt --all -- --check
        cargo fmt --manifest-path std/kernel/Cargo.toml -- --check
        cargo fmt --manifest-path tests/fixtures/native-p3/Cargo.toml -- --check
        cargo fmt --manifest-path tests/fixtures/stream-lifecycle-probe/Cargo.toml -- --check
        cargo fmt --manifest-path tests/fixtures/gate2b-root/Cargo.toml -- --check

    - name: Check IPFS release publish scripts
      run: |
        bash tests/test_ipfs_release_publish.sh
        bash tests/test_ipfs_release_publish_runtime.sh
        bash tests/test_native_p3_fixture.sh
        bash tests/test_release_ancestry.sh
        bash tests/test_deploy_context.sh
        bash tests/test_deploy_verify.sh
        bash tests/test_release_workflow.sh
        python3 tests/test_release_auth.py
        bash -n scripts/assemble_release.sh tests/test_container_boot.sh tests/test_release_package.sh
        if command -v shellcheck >/dev/null 2>&1; then
          shellcheck scripts/install.sh scripts/sign_release.sh scripts/build_wasip3_component.sh scripts/check_first_party_wasip3.sh scripts/check_native_p3_fixture.sh scripts/check_release_ancestry.sh scripts/deploy_verify.sh tests/test_ipfs_release_publish.sh tests/test_ipfs_release_publish_runtime.sh tests/test_native_p3_fixture.sh tests/test_release_ancestry.sh tests/test_deploy_context.sh tests/test_deploy_verify.sh tests/test_release_workflow.sh scripts/assemble_release.sh tests/test_container_boot.sh tests/test_release_package.sh
        fi

    - name: Check offline native qualification controls
      run: |
        python3 tests/test_native_release_inputs.py
        python3 tests/test_qualify_native_upgrade.py
        python3 tests/test_prepare_current_native_release.py
        python3 tests/test_native_release_integration.py
        python3 tests/test_native_release_provisioner.py
        python3 tests/test_native_development_boot.py
        python3 tests/test_native_qualification_boundary.py

    - uses: actions/setup-go@v5
      with:
        go-version-file: tests/publication-negative-control/go.mod
        cache-dependency-path: tests/publication-negative-control/go.sum

    - name: Reproduce delayed older Boxo writes
      working-directory: tests/publication-negative-control
      run: go test -count=1 .

  fuzz-corpus:
    name: Fuzz corpus regressions
    needs: lockfiles
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-30
    steps:
    - uses: actions/checkout@v5

    - name: Install pinned Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        toolchain: nightly-2026-08-30

    - uses: Swatinem/rust-cache@v2
      with:
        key: fuzz-corpus
        workspaces: fuzz -> target

    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --version 0.13.2 --locked

    - uses: ./.github/actions/setup-capnp

    # cargo-fuzz 0.13.2 cannot forward --locked. The lockfiles job checks the
    # separate fuzz workspace before this lane; see doc/dependencies/lockfiles.md.
    - name: Build fuzz targets
      run: |
        cargo fuzz build fuzz_kubo_ls_response
        cargo fuzz build fuzz_kubo_mfs_ls_response
        cargo fuzz build fuzz_composer_dagpb_decode
        cargo fuzz build fuzz_composer_unixfs_metadata
        cargo fuzz build fuzz_kubo_dag_import_response

    # Checked-in corpus replay is deterministic regression testing. Mutation
    # fuzzing remains a manual, bounded campaign.
    - name: Replay checked-in fuzz corpus
      shell: bash
      run: |
        set -euo pipefail

        for target in \
          fuzz_kubo_ls_response \
          fuzz_kubo_mfs_ls_response \
          fuzz_composer_dagpb_decode \
          fuzz_composer_unixfs_metadata \
          fuzz_kubo_dag_import_response
        do
          seeds=()
          while IFS= read -r -d '' seed; do
            seeds+=("$seed")
          done < <(git ls-files -z -- "fuzz/corpus/${target}")

          if (( ${#seeds[@]} == 0 )); then
            echo "No checked-in seeds found for ${target}" >&2
            exit 1
          fi

          echo "Replaying ${#seeds[@]} checked-in seeds for ${target}"
          WW_FUZZ_SEMANTIC_REPLAY=1 cargo fuzz run "$target" "${seeds[@]}"
        done

  clippy:
    name: Clippy
    needs: lockfiles
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - uses: ./.github/actions/setup-capnp

    - uses: Swatinem/rust-cache@v2

    - name: cargo clippy (host workspace)
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

  solidity:
    name: Solidity (Foundry)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        # Pin a specific Foundry version so foundryup skips the
        # `api.github.com/repos/foundry-rs/foundry/releases/latest` API
        # call (the `latest`/`stable` channels hit it unconditionally
        # and get 403 rate-limited on shared Actions IPs). The action
        # does not accept a `token` input, so this is the canonical
        # workaround. Bump periodically.
        version: v1.7.1

    - name: Check formatting
      working-directory: contracts/stem
      run: forge fmt --check

    - name: Build contracts
      working-directory: contracts/stem
      run: forge build --sizes

    - name: Run tests
      working-directory: contracts/stem
      run: forge test -vvv

  build:
    name: Build ww binary
    needs: lockfiles
    runs-on: ubuntu-latest
    env:
      # Bound Host linker resource use; keep these settings equal in test-host.
      # Debug assertions and overflow checks remain enabled.
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu

    - uses: ./.github/actions/setup-capnp

    - uses: Swatinem/rust-cache@v2
      with:
        # `key` is job-specific; share dependency artifacts with the test job.
        shared-key: build-test-no-debuginfo

    - name: Build host workspace test binaries
      run: cargo build --workspace --tests --locked

  build-wasm:
    name: Build native wasm32-wasip3 components
    needs: lockfiles
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    # The native fixture's host tests use stable via rust-toolchain.toml.
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install pinned Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        toolchain: nightly-2026-08-30
        components: rust-src

    - uses: ./.github/actions/setup-capnp

    - name: Install pinned WASI P3 tools
      run: |
        set -euo pipefail
        tool_dir="$RUNNER_TEMP/native-p3-tools"
        sdk_archive="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux.tar.gz"
        wasm_tools_archive="$RUNNER_TEMP/wasm-tools-1.258.0-x86_64-linux.tar.gz"
        mkdir -p "$tool_dir"

        curl -fL \
          https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz \
          -o "$sdk_archive"
        echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $sdk_archive" \
          | sha256sum --check --strict
        tar -xzf "$sdk_archive" -C "$tool_dir"

        curl -fL \
          https://github.com/bytecodealliance/wasm-tools/releases/download/v1.258.0/wasm-tools-1.258.0-x86_64-linux.tar.gz \
          -o "$wasm_tools_archive"
        echo "b52d14eb74a4852cc249369bd4480c2b2fdd876145f41db51ff52269ded240ce  $wasm_tools_archive" \
          | sha256sum --check --strict
        tar -xzf "$wasm_tools_archive" -C "$tool_dir"

        echo "WASI_SDK_PATH=$tool_dir/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
        echo "WASM_TOOLS=$tool_dir/wasm-tools-1.258.0-x86_64-linux/wasm-tools" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@v2
      with:
        key: wasm-p3

    # The fixture also compiles host-side cell tests, so restore before it runs.
    - name: Build and validate native P3 fixture
      run: make test-p3-fixture

    - name: Validate real guest RPC session cancellation
      run: make test-guest-session-cancel

    - name: Build and validate first-party P3 components
      run: make test-wasm

    - name: Stage and validate canonical FHS
      run: |
        make package-check
        cargo build --locked -p ww-release --features package --bin ww-release-package
        bash tests/test_release_package.sh target/debug/examples/stage_fhs target/fhs

    - uses: actions/upload-artifact@v7
      with:
        name: wasm-artifacts
        path: |
          std/kernel/bin/main.wasm
          std/status/bin/status.wasm
          target/fhs/
          target/debug/examples/stage_fhs
          target/debug/ww-release-package
          examples/*/bin/
          target/native-p3-fixture/wasm32-wasip3/release/native_p3_fixture.wasm
          target/authority-probe/wasm32-wasip3/release/authority_probe.wasm
          target/gate2b-root/wasm32-wasip3/release/gate2b_root_probe.wasm
          target/routing-key-probe/wasm32-wasip3/release/routing_key_probe.wasm
          target/stream-lifecycle-probe/wasm32-wasip3/release/stream_lifecycle_probe.wasm
        retention-days: 1

  test-host:
    name: Test host
    needs: [build, build-wasm]
    runs-on: ubuntu-latest
    env:
      # Match the producer's profiles and avoid concurrent full-debug links.
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu

    - uses: ./.github/actions/setup-capnp

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        # See note in the `solidity` job above: pin to avoid 403 rate
        # limits on the unauthenticated `releases/latest` API call.
        version: v1.7.1

    - uses: ./.github/actions/setup-kubo

    - name: Start IPFS daemon
      run: |
        ipfs init --profile=test
        if [ -n "$IPFS_PEER_ADDR" ]; then
          ipfs bootstrap rm --all
          ipfs bootstrap add "$IPFS_PEER_ADDR"
        fi
        ipfs daemon --enable-gc &
        # Plain `ipfs id` can open the repo offline and race the daemon for repo.lock.
        KUBO_API_FILE="${IPFS_PATH:-$HOME/.ipfs}/api"
        for _ in $(seq 1 30); do
          if [ -s "$KUBO_API_FILE" ]; then
            KUBO_API_MULTIADDR="$(cat "$KUBO_API_FILE")"
            ipfs --api="$KUBO_API_MULTIADDR" id >/dev/null 2>&1 && break
          fi
          sleep 0.5
        done
        KUBO_API_MULTIADDR="$(cat "$KUBO_API_FILE")"
        ipfs --api="$KUBO_API_MULTIADDR" id >/dev/null
        KUBO_API_PORT="${KUBO_API_MULTIADDR##*/tcp/}"
        case "$KUBO_API_PORT" in
          ''|*[!0-9]*) echo "Invalid Kubo API address: $KUBO_API_MULTIADDR" >&2; exit 1 ;;
        esac
        echo "WW_TEST_KUBO_ADDR=127.0.0.1:$KUBO_API_PORT" >> "$GITHUB_ENV"
      env:
        IPFS_PEER_ADDR: ${{ secrets.IPFS_PEER_ADDR }}

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: build-test-no-debuginfo

    - name: Download validated P3 components
      uses: actions/download-artifact@v8
      with:
        name: wasm-artifacts

    - name: Check embedded WASI std and test fixtures
      run: |
        test -s std/kernel/bin/main.wasm
        test -s std/status/bin/status.wasm
        test -s examples/echo/bin/echo.wasm
        test -s examples/discovery/bin/discovery.wasm
        test -s target/native-p3-fixture/wasm32-wasip3/release/native_p3_fixture.wasm
        test -s target/authority-probe/wasm32-wasip3/release/authority_probe.wasm
        test -s target/gate2b-root/wasm32-wasip3/release/gate2b_root_probe.wasm
        test -s target/stream-lifecycle-probe/wasm32-wasip3/release/stream_lifecycle_probe.wasm

    - name: Report resources before Host tests
      run: |
        df -h . "$RUNNER_TEMP"
        free -h
        du -sh target

    - name: Run host workspace tests
      run: cargo test --workspace --locked -- --test-threads=2
      env:
        WW_TEST_REQUIRE_KUBO: "1"
        WW_REQUIRE_P3_FIXTURES: "1"
        WW_USE_PREBUILT_AUTHORITY_PROBE: "1"
        # Reuse compiled WASM across fresh engines within this job.
        WW_CWASM_DIR: ${{ runner.temp }}/ww-cwasm

    - name: Report resources after Host tests
      if: ${{ always() }}
      run: |
        df -h . "$RUNNER_TEMP"
        free -h
        if [ -d target ]; then du -sh target; fi

    - name: Validate process-wide outbound limits
      # Each ignored quota test owns the entire process budget while it runs.
      # Keep these in separate processes from ordinary concurrent tests.
      run: |
        cargo test -p rpc --lib outbound::tests::process_owner_limit_spans_threads_and_recovers_after_idempotent_close --locked -- --ignored --exact
        cargo test -p rpc --lib outbound::tests::default_budget_bounds_work_across_registry_recreation --locked -- --ignored --exact
        cargo test -p rpc --lib outbound::tests::explicit_host_budgets_cannot_bypass_process_limit --locked -- --ignored --exact

    - name: Validate actual packaged installation and startup
      run: |
        cargo build --locked
        WW_TEST_BINARY=target/debug/ww WW_TEST_FHS=target/fhs python3 tests/test_host_install.py
        python3 tests/test_install.py --binary target/debug/ww --fhs target/fhs
        bash tests/test_installed_boot.sh target/debug/ww target/fhs

    - name: Smoke-test Chess authority proof command
      run: |
        set -euo pipefail
        proof_exit=0
        cargo run --locked -q -p chess --example authority_proof \
          >proof.stdout 2>proof.stderr || proof_exit=$?
        status=0
        if [ "$proof_exit" -ne 0 ]; then
          echo "FAIL: proof command exited with status $proof_exit"
          status=1
        fi
        if [ -s proof.stderr ]; then
          echo "FAIL: proof wrote to stderr:"; cat proof.stderr; status=1
        fi
        lines="$(wc -l < proof.stdout)"
        if [ "$lines" -ne 30 ]; then
          echo "FAIL: expected exactly 30 stdout lines, got $lines"; status=1
        fi
        if [ "$(head -n 1 proof.stdout)" != "WETWARE CHESS AUTHORITY PROOF" ]; then
          echo "FAIL: unexpected first stdout line"; status=1
        fi
        if [ "$(tail -n 1 proof.stdout)" != "PASS" ]; then
          echo "FAIL: transcript does not end with PASS"; status=1
        fi
        if [ "$(grep -c '^PASS$' proof.stdout)" != "1" ]; then
          echo "FAIL: expected exactly one PASS line"; status=1
        fi
        if grep -q '^ERROR:' proof.stdout; then
          echo "FAIL: stray ERROR lines in stdout"; status=1
        fi
        if [ "$status" -ne 0 ]; then
          echo "--- stdout ---"; cat proof.stdout
          exit 1
        fi
        cat proof.stdout

    - name: Compare development and release package outputs
      run: |
        cargo build --release --locked -p ww-release --features package --bin ww-release-package
        python3 tests/test_release_package_profiles.py \
          --development-tool target/debug/ww-release-package \
          --release-tool target/release/ww-release-package --fhs target/fhs

    - name: Validate public release package library
      run: cargo test --locked -p ww-release --features package

  test-stdlib:
    name: Test standalone standard library
    # Native unit tests do not consume the host build or WASM artifacts.
    needs: lockfiles
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - uses: ./.github/actions/setup-capnp

    - uses: Swatinem/rust-cache@v2
      with:
        key: stdlib
        workspaces: |
          crates/wagi-guest -> target
          std/kernel -> target
          std/status -> target

    - name: Run standalone standard-library tests
      run: |
        cargo test --locked --manifest-path crates/wagi-guest/Cargo.toml
        cargo test --locked --manifest-path std/kernel/Cargo.toml
        cargo test --locked --manifest-path std/status/Cargo.toml

  test:
    # Preserve the required branch-protection check for both test suites.
    name: Test
    needs: [test-host, test-stdlib]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Require both test suites to pass
      env:
        HOST_RESULT: ${{ needs.test-host.result }}
        STDLIB_RESULT: ${{ needs.test-stdlib.result }}
      run: test "$HOST_RESULT" = success && test "$STDLIB_RESULT" = success

  build-architecture-map:
    name: Build architecture map
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/master'
          && needs.changes.outputs.architecture_map == 'true')
    needs: [changes, fmt, clippy, solidity, build, test, test-architecture-map]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
    - uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        package-manager-cache: false

    - name: Test map generator
      run: node --test scripts/generate-architecture-map.test.mjs

    - name: Generate Pages artifact
      run: |
        mkdir site
        node scripts/generate-architecture-map.mjs \
          --output site \
          --revision "${{ github.sha }}"
        test "$(find site -maxdepth 1 -type f | wc -l | tr -d ' ')" = 1
        test -f site/index.html

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: site

  deploy-architecture-map:
    name: Deploy architecture map
    if: ${{ needs.build-architecture-map.result == 'success' }}
    needs: build-architecture-map
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy GitHub Pages artifact
      id: deployment
      uses: actions/deploy-pages@v4

  # === Master-only: fan out after checks pass ===

  build-binaries:
    name: Build ${{ matrix.artifact }}
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/master'
          && (needs.changes.outputs.std == 'true' || needs.changes.outputs.host == 'true'))
    needs: [changes, fmt, clippy, solidity, build, build-wasm]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ww-linux-x86_64
            bin_path: bin/linux/x86_64
            use_cross: false

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ww-linux-aarch64
            bin_path: bin/linux/aarch64
            use_cross: true

          - target: aarch64-apple-darwin
            os: macos-15
            artifact: ww-macos-aarch64
            bin_path: bin/macos/aarch64
            use_cross: false

          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: ww-macos-x86_64
            bin_path: bin/macos/x86_64
            use_cross: false

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: ww-linux-musl-x86_64
            bin_path: bin/linux/musl-x86_64
            use_cross: false
            install_musl: true

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - uses: actions/download-artifact@v8
      with:
        name: wasm-artifacts

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - uses: ./.github/actions/setup-capnp
      if: ${{ !matrix.use_cross }}
      with:
        cache-key-suffix: ${{ matrix.target }}

    - name: Install musl toolchain
      if: ${{ matrix.install_musl }}
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Install cross
      if: ${{ matrix.use_cross }}
      run: cargo install cross --git https://github.com/cross-rs/cross

    - uses: Swatinem/rust-cache@v2
      with:
        key: master-${{ matrix.target }}

    - name: Build (native)
      if: ${{ !matrix.use_cross }}
      run: cargo build --release --locked --bin ww --target ${{ matrix.target }}

    - name: Build (cross)
      if: ${{ matrix.use_cross }}
      # cross runs its own unlocked metadata before forwarding build flags.
      run: |
        cargo metadata --locked --format-version 1 --manifest-path Cargo.toml > /dev/null
        cross build --release --locked --bin ww --target ${{ matrix.target }}

    - name: Package binary
      run: |
        mkdir -p ${{ matrix.bin_path }}
        test -s target/fhs/boot/kernel.wasm
        test -s target/fhs/bin/status.wasm
        cmp std/kernel/bin/main.wasm target/fhs/boot/kernel.wasm
        cmp std/status/bin/status.wasm target/fhs/bin/status.wasm
        cp target/${{ matrix.target }}/release/ww ${{ matrix.bin_path }}/ww
        cp -R target/fhs ${{ matrix.bin_path }}/fhs
        printf '%s\n' "${{ github.sha }}" > ${{ matrix.bin_path }}/REVISION
        python3 -c 'import json,sys; print(json.dumps(dict(repository="https://github.com/wetware/ww", revision=sys.argv[1], builder=sys.argv[2])))' \
          "${{ github.sha }}" "github-actions:${{ github.run_id }}:${{ github.run_attempt }}:${{ matrix.target }}" \
          > ${{ matrix.bin_path }}/PROVENANCE.json
        (cd ${{ matrix.bin_path }} && shasum -a 256 ww > SHA256SUMS)

    - name: Verify static linking
      if: ${{ matrix.install_musl }}
      run: file ${{ matrix.bin_path }}/ww | grep -qE "static(ally|-pie) linked"

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.bin_path }}/
        retention-days: 1

  validate-release:
    name: Validate release packages and container boot
    if: >-
      github.ref == 'refs/heads/master'
      && (github.event_name == 'workflow_dispatch'
          || needs.changes.outputs.std == 'true' || needs.changes.outputs.host == 'true')
    needs: [changes, test, build-binaries, build-wasm]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-kubo
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
    - name: Validate and assemble all five platform packages
      run: |
        chmod +x artifacts/wasm-artifacts/target/debug/examples/stage_fhs
        bash scripts/assemble_release.sh artifacts release-tree "${{ github.sha }}"
        cp artifacts/wasm-artifacts/target/debug/ww-release-package ./ww-release-package
        chmod +x ./ww-release-package
        bash tests/test_release_descriptor_package.sh ./ww-release-package artifacts release-tree
        chmod +x artifacts/ww-linux-musl-x86_64/ww
        WW_TEST_BINARY=artifacts/ww-linux-musl-x86_64/ww WW_TEST_FHS=release-tree/fhs python3 tests/test_host_install.py
        python3 tests/test_install.py --binary artifacts/ww-linux-musl-x86_64/ww --fhs release-tree/fhs
    - name: Build and boot artifact containers
      run: |
        mkdir deploy-context
        cp artifacts/ww-linux-musl-x86_64/ww deploy-context/ww
        cp artifacts/ww-linux-x86_64/ww deploy-context/ww-amd64
        chmod +x deploy-context/ww-amd64
        cp -R release-tree/fhs deploy-context/fhs
        docker build -f Containerfile.deploy -t ww-validated:deploy deploy-context
        bash tests/test_container_boot.sh ww-validated:deploy release-tree/fhs
        docker build --build-arg TARGETARCH=amd64 -f Containerfile.release -t ww-validated:release deploy-context
        bash tests/test_container_boot.sh ww-validated:release release-tree/fhs release
    - name: Build and boot source container
      run: |
        mkdir -p std/kernel/bin std/status/bin
        cp release-tree/fhs/boot/kernel.wasm std/kernel/bin/main.wasm
        cp release-tree/fhs/bin/status.wasm std/status/bin/status.wasm
        docker build --build-arg WW_BUILD_GIT_SHA="${{ github.sha }}" -f Containerfile -t ww-validated:source .
        bash tests/test_container_boot.sh ww-validated:source release-tree/fhs
    - name: Archive validated release inputs as CAR
      run: |
        set -euo pipefail
        mkdir release-input
        cp -R release-tree release-input/release-tree
        for platform in linux-x86_64 linux-aarch64 macos-aarch64 macos-x86_64 linux-musl-x86_64; do
          mkdir -p "release-input/artifacts/ww-$platform"
          for receipt in REVISION SHA256SUMS PROVENANCE.json; do
            cp "artifacts/ww-$platform/$receipt" "release-input/artifacts/ww-$platform/$receipt"
          done
        done
        ./ww-release-package pack-tree --tree release-input --spool release-input-spool
        ./ww-release-package export-car --spool release-input-spool --car release-input.car
    - name: Upload validated release input CAR
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        path: release-input.car
        archive: false
        if-no-files-found: error
        retention-days: 1
    - name: Save tested image
      run: docker save ww-validated:deploy -o tested-image.tar
    - name: Upload tested container image
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        path: tested-image.tar
        archive: false
        if-no-files-found: error
        retention-days: 1

  release_image:
    name: Build and publish ww-master image
    if: >-
      !cancelled() && github.ref == 'refs/heads/master'
      && needs.test.result == 'success' && needs.validate-release.result == 'success'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && github.ref == 'refs/heads/master'
              && (needs.changes.outputs.std == 'true' || needs.changes.outputs.host == 'true')))
    needs: [changes, test, validate-release]
    runs-on: ubuntu-latest
    environment: master
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: tested-image.tar
        skip-decompress: true
        digest-mismatch: error
    - name: Load the tested image
      run: docker load -i tested-image.tar
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push the tested image
      run: |
        docker tag ww-validated:deploy ghcr.io/wetware/ww:master-${{ github.sha }}
        docker tag ww-validated:deploy ghcr.io/wetware/ww:master
        docker push ghcr.io/wetware/ww:master-${{ github.sha }}
        docker push ghcr.io/wetware/ww:master
    - name: Wait for image to be pullable from GHCR
      env:
        IMAGE: ghcr.io/wetware/ww:master-${{ github.sha }}
      run: |
        for i in 1 2 3 4 5; do
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then exit 0; fi
          sleep $((i * 5))
        done
        echo "ERROR: image $IMAGE never appeared in GHCR"
        exit 1

  publish:
    name: Publish to IPFS
    needs: [changes, test, validate-release, release_image]
    # Public CI produces validated artifacts. Official release operations moved
    # to the private operator repository. Preserve the existing publication hold.
    # Historical writers require the separate fence in doc/legacy-publication-hold.md.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
    - name: Refuse unintegrated infrastructure publication
      run: |
        echo 'Official publication is private and remains inactive pending explicit activation approval.' >&2
        exit 1
