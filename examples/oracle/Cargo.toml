[package]
name = "oracle"
version = "0.1.0"
edition = "2021"

[workspace]  # standalone — not part of the host workspace

[dependencies]
capnp = "0.25.3"
capnp-rpc = "0.25.0"
futures   = "0.3"
log       = "0.4"
wit-bindgen = { version = "=0.62.0", git = "https://github.com/wetware/wit-bindgen", rev = "025f95c294373c73e12eaee335577c81477d5a20" }
hex       = "0.4"
routing-key = { path = "../../crates/guest/routing-key" }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
system     = { path = "../../std/system" }
wagi-guest = { path = "../../crates/wagi-guest" }

[lib]
crate-type = ["cdylib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.9"

[dev-dependencies]
tokio      = { version = "1", features = ["rt", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }

[build-dependencies]
capnpc = "0.25.3"

# Exact capnp-rpc import-wrapper and terminalization patches.
# Provenance and removal gates: ../../doc/dependencies/capnp-rpc.md.
[patch.crates-io]
capnp-rpc = { git = "https://github.com/wetware/capnproto-rust", rev = "b3befb30fa1cb17b3b49f278d1a6f02b2ef2860a" }
