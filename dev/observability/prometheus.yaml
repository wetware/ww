global:
  scrape_interval: 2s
  scrape_timeout: 1s
scrape_configs:
  - job_name: wetware
    static_configs:
      - targets: [host.docker.internal:19091]
  - job_name: collector
    static_configs:
      - targets: [collector:8888]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
