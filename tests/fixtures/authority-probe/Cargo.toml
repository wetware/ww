[package]
name = "authority-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
capnp = "0.25.3"
capnp-rpc = "0.25.0"
serde = "1"
serde_json = "1"
system = { path = "../../../std/system" }
wit-bindgen = "=0.61.1"

[lib]
crate-type = ["cdylib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.9"

[build-dependencies]
capnpc = "0.25.3"

# Keep the guest on the same duplicate-import fix as the host. The T1 gate
# asserts the exact resolved commit from both lockfiles.
[patch.crates-io]
capnp-rpc = { git = "https://github.com/wetware/capnproto-rust", branch = "ww/import-fix-0.25-consume" }
