[package]
name = "authority-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
capnp = "0.25.3"
capnp-rpc = "0.25.0"
serde = "1"
serde_json = "1"
system = { path = "../../../std/system" }
wit-bindgen = { version = "=0.62.0", git = "https://github.com/wetware/wit-bindgen", rev = "025f95c294373c73e12eaee335577c81477d5a20" }

[lib]
crate-type = ["cdylib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.9"

[build-dependencies]
capnpc = "0.25.3"

# Keep the guest on the same duplicate-import fix as the host. The T1 gate
# asserts the exact resolved commit from both lockfiles.
[patch.crates-io]
capnp-rpc = { git = "https://github.com/wetware/capnproto-rust", rev = "b3befb30fa1cb17b3b49f278d1a6f02b2ef2860a" }
