[package]
name = "cell"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
arc-swap = "1"
lru = "0.12"
cid = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
dirs = { workspace = true }
cap-std = "4.0"
wasmtime = { workspace = true, features = ["call-hook"] }
wasmtime-wasi = { version = "=48.0.1", default-features = false, features = ["p2", "p3"] }
wasmtime-wasi-io = "=48.0.1"
tempfile = { workspace = true }

# Workspace crates
authority = { package = "wetware-authority", path = "../authority" }
cache = { package = "ww-cache", path = "../cache" }
ipfs = { path = "../ipfs" }

[dev-dependencies]
wat = "1"
wit-component = { version = "0.244", features = ["dummy-module"] }
wit-parser = "0.244"
